<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Síndico Virtual</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --bot: #e9eef3;
    --user: #2563eb;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger: #b91c1c;
    --warn: #b45309;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    height: min(720px, 100vh - 32px);
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white; display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .controls {
    display: flex; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: #fafbfc;
  }
  .controls input {
    flex: 1; min-width: 0;
    padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; background: white;
  }
  .messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
  .msg.bot { background: var(--bot); color: var(--text); border-bottom-left-radius: 4px; align-self: flex-start; }
  .msg.user { background: var(--user); color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .msg.bot .meta.human { color: var(--warn); font-weight: 600; }
  .composer {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border);
  }
  .composer textarea {
    flex: 1; resize: none; max-height: 120px;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 14px; outline: none;
  }
  .composer textarea:focus { border-color: var(--user); }
  .composer button {
    padding: 0 16px; border: none; border-radius: 10px;
    background: var(--user); color: white; font-weight: 600; cursor: pointer;
    font-size: 14px;
  }
  .composer button:disabled { background: #93c5fd; cursor: not-allowed; }
  .typing { font-size: 12px; color: var(--muted); padding: 0 16px 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">S</div>
    <div>
      <h1>Síndico Virtual</h1>
      <p>Tire dúvidas sobre o regimento do seu prédio</p>
    </div>
  </header>
  <div class="controls">
    <input id="tenant" placeholder="tenant_id (ex: ed-flores)" autocomplete="off">
    <input id="sender" placeholder="seu número/id (ex: morador-101)" autocomplete="off">
  </div>
  <div class="messages" id="messages"></div>
  <div class="typing" id="typing" style="display:none">Consultando regimento…</div>
  <form class="composer" id="composer" autocomplete="off">
    <textarea id="text" rows="1" placeholder="Posso trazer pet?" required></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const messages = $("messages"), typing = $("typing"), form = $("composer"), text = $("text"), send = $("send");
  const tenant = $("tenant"), sender = $("sender");

  tenant.value = localStorage.getItem("portaria_tenant") || "";
  sender.value = localStorage.getItem("portaria_sender") || "";

  tenant.addEventListener("change", () => localStorage.setItem("portaria_tenant", tenant.value.trim()));
  sender.addEventListener("change", () => localStorage.setItem("portaria_sender", sender.value.trim()));

  function add(role, text, meta) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    if (meta) {
      const m = document.createElement("div");
      m.className = "meta" + (meta.routed === "human" ? " human" : "");
      m.textContent = meta.label;
      div.appendChild(m);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  add("bot", "Oi! Sou o síndico virtual. Me conta o que você precisa saber sobre o prédio.");

  text.addEventListener("input", () => {
    text.style.height = "auto";
    text.style.height = Math.min(text.scrollHeight, 120) + "px";
  });
  text.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = text.value.trim();
    const t = tenant.value.trim();
    const s = sender.value.trim();
    if (!q || !t || !s) {
      add("bot", "Preencha tenant_id e seu identificador antes de perguntar.");
      return;
    }
    add("user", q);
    text.value = ""; text.style.height = "auto";
    send.disabled = true; typing.style.display = "block";
    try {
      const res = await fetch("/api/v1/portaria/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Tenant-ID": t },
        body: JSON.stringify({ sender_id: s, message: q }),
      });
      const data = await res.json();
      if (!res.ok) {
        add("bot", data.error || "Erro ao processar a mensagem.", { routed: "human", label: "erro" });
      } else {
        let label = data.cached ? "cache" : (data.grounded ? "no regimento" : "fora do regimento");
        if (data.routed === "human") label = "encaminhar para humano";
        add("bot", data.text, { routed: data.routed, label: label });
      }
    } catch (err) {
      add("bot", "Sem conexão. Tente de novo.", { routed: "human", label: "erro" });
    } finally {
      send.disabled = false; typing.style.display = "none"; text.focus();
    }
  });
</script>
</body>
</html>
