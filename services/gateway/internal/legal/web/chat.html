<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião Jurídico</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #1e40af;
    --accent-2: #334155;
    --ok: #047857;
    --warn: #b45309;
    --err: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Georgia", "Times New Roman", serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: var(--ink);
    display: flex; justify-content: center; align-items: center;
    padding: 16px;
  }
  .app {
    width: 100%; max-width: 720px; height: min(820px, 100vh - 32px);
    background: var(--panel); border-radius: 4px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--border);
  }
  header {
    padding: 18px 22px; border-bottom: 2px solid var(--accent);
    background: white; display: flex; align-items: center; gap: 14px;
  }
  header .seal {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); color: white;
    display: grid; place-items: center; font-weight: 700; font-size: 20px;
    font-family: serif;
  }
  header h1 { font-size: 20px; margin: 0; color: var(--accent); letter-spacing: 0.3px; }
  header p { font-size: 12px; color: var(--muted); margin: 2px 0 0; font-family: sans-serif; }
  .controls {
    display: flex; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); background: #f8fafc;
    font-family: sans-serif;
  }
  .controls input {
    flex: 1; min-width: 0;
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 3px;
    font-size: 12px; font-family: sans-serif;
  }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    background: #fafbfc;
  }
  .msg { max-width: 92%; padding: 14px 18px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; font-size: 15px; border-radius: 2px; }
  .msg.bot { background: white; border: 1px solid var(--border); border-left: 4px solid var(--accent); align-self: flex-start; }
  .msg.user { background: var(--accent-2); color: white; align-self: flex-end; font-family: sans-serif; font-size: 14px; }
  .msg.err { border-left-color: var(--err); background: #fef2f2; }
  .msg.warn { border-left-color: var(--warn); background: #fffbeb; }
  .status-row { font-size: 11px; color: var(--muted); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; font-family: sans-serif; }
  .pill { padding: 2px 8px; border-radius: 10px; background: var(--border); color: var(--ink); font-weight: 500; }
  .pill.ok { background: #d1fae5; color: var(--ok); }
  .pill.warn { background: #fef3c7; color: var(--warn); }
  .pill.err { background: #fee2e2; color: var(--err); }
  .citations { margin-top: 10px; font-size: 12px; font-family: sans-serif; color: var(--accent-2); }
  .citations ul { margin: 4px 0 0 0; padding-left: 18px; }
  .sources { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--muted); font-family: sans-serif; }
  .sources strong { color: var(--ink); }
  .composer {
    display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border);
    background: white;
  }
  .composer textarea {
    flex: 1; resize: none; max-height: 140px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 3px;
    font-family: inherit; font-size: 15px; outline: none;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer button {
    padding: 0 20px; border: none; border-radius: 3px;
    background: var(--accent); color: white; font-weight: 700; cursor: pointer;
    font-family: sans-serif; letter-spacing: 0.3px; font-size: 13px;
  }
  .composer button:disabled { background: #93c5fd; cursor: not-allowed; }
  .typing { font-size: 12px; color: var(--muted); padding: 0 20px 6px; font-family: sans-serif; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="seal">§</div>
    <div>
      <h1>Guardião Jurídico</h1>
      <p>Consulta à base legal com verificação de citações</p>
    </div>
  </header>
  <div class="controls">
    <input id="tenant" placeholder="escritório (tenant_id)" autocomplete="off">
    <input id="user" placeholder="advogado (user_id)" autocomplete="off">
  </div>
  <div class="messages" id="messages"></div>
  <div class="typing" id="typing" style="display:none">Consultando base legal…</div>
  <form class="composer" id="composer" autocomplete="off">
    <textarea id="text" rows="2" placeholder="Ex.: Qual o limite para dispensa de licitação na Lei 8.666/1993?" required></textarea>
    <button id="send" type="submit">Consultar</button>
  </form>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const messages = $("messages"), typing = $("typing"), form = $("composer"), text = $("text"), send = $("send");
  const tenant = $("tenant"), user = $("user");
  tenant.value = localStorage.getItem("legal_tenant") || "";
  user.value = localStorage.getItem("legal_user") || "";
  tenant.addEventListener("change", () => localStorage.setItem("legal_tenant", tenant.value.trim()));
  user.addEventListener("change", () => localStorage.setItem("legal_user", user.value.trim()));

  function renderBot(data) {
    const div = document.createElement("div");
    const status = data.status || "";
    const cls = status === "grounded" ? "bot" :
                status === "unverified_citations" ? "bot warn" :
                status === "ungrounded" || status === "orchestrator_error" ? "bot err" : "bot";
    div.className = "msg " + cls;
    div.textContent = data.answer || "(sem resposta)";

    const row = document.createElement("div");
    row.className = "status-row";
    const pill = document.createElement("span");
    pill.className = "pill " + (status === "grounded" ? "ok" : status === "unverified_citations" ? "warn" : status.includes("error") || status === "ungrounded" ? "err" : "");
    pill.textContent = {
      "grounded": "verificado",
      "unverified_citations": "citações não confirmadas",
      "ungrounded": "fora da base",
      "no_context": "sem documentos",
      "orchestrator_error": "erro",
    }[status] || status;
    row.appendChild(pill);
    if (data.cached) { const p = document.createElement("span"); p.className = "pill"; p.textContent = "cache"; row.appendChild(p); }
    if (data.model) { const p = document.createElement("span"); p.className = "pill"; p.textContent = data.model; row.appendChild(p); }
    if (data.timing && data.timing.total_ms) { const p = document.createElement("span"); p.className = "pill"; p.textContent = data.timing.total_ms + "ms"; row.appendChild(p); }
    div.appendChild(row);

    if (data.citations && Object.keys(data.citations).length) {
      const cit = document.createElement("div");
      cit.className = "citations";
      cit.innerHTML = "<strong>Citações detectadas:</strong>";
      const ul = document.createElement("ul");
      for (const [kind, values] of Object.entries(data.citations)) {
        const li = document.createElement("li");
        const unverified = (data.unverified_citations || []).filter(u => u.kind === kind).map(u => u.value);
        const tagged = values.map(v => unverified.includes(v) ? `<span style="color:var(--err)">${v} ✗</span>` : `<span style="color:var(--ok)">${v} ✓</span>`).join(", ");
        li.innerHTML = `<strong>${kind}:</strong> ${tagged}`;
        ul.appendChild(li);
      }
      cit.appendChild(ul);
      div.appendChild(cit);
    }

    if (data.sources && data.sources.length) {
      const src = document.createElement("div");
      src.className = "sources";
      const lines = data.sources.slice(0, 5).map(s => `<strong>${s.file_name}</strong>${s.page ? ' (p.' + s.page + ')' : ''} — score ${(s.score || 0).toFixed(2)}`).join("<br>");
      src.innerHTML = "<strong>Fontes:</strong><br>" + lines;
      div.appendChild(src);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function renderUser(text) {
    const d = document.createElement("div");
    d.className = "msg user"; d.textContent = text;
    messages.appendChild(d); messages.scrollTop = messages.scrollHeight;
  }

  renderBot({
    answer: "Bom dia. Sou o assistente jurídico deste escritório. Informe sua consulta e receberá uma resposta baseada exclusivamente na base legal indexada, com verificação automática de citações.",
    status: "grounded"
  });

  text.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = text.value.trim(); const t = tenant.value.trim(); const u = user.value.trim();
    if (!q || !t || !u) {
      renderBot({ answer: "Preencha tenant e user antes de consultar.", status: "orchestrator_error" });
      return;
    }
    renderUser(q);
    text.value = "";
    send.disabled = true; typing.style.display = "block";
    try {
      const res = await fetch("/api/v1/legal/query", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Tenant-ID": t },
        body: JSON.stringify({ user_id: u, query: q }),
      });
      const data = await res.json();
      if (!res.ok && !data.status) {
        renderBot({ answer: data.error || "Erro ao consultar.", status: "orchestrator_error" });
      } else {
        renderBot(data);
      }
    } catch (err) {
      renderBot({ answer: "Falha de rede.", status: "orchestrator_error" });
    } finally {
      send.disabled = false; typing.style.display = "none"; text.focus();
    }
  });
</script>
</body>
</html>
